name: Create CSV

on:
  schedule:
    # 每天 UTC 01:40
    # = 台灣時間 09:40
    - cron: "40 1 * * *"

  # 允許手動執行，方便測試
  workflow_dispatch:

jobs:
  create-csv:
    runs-on: ubuntu-latest

    steps:
      # 1. 把 repository 的程式碼抓下來
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 產生 CSV
      - name: Create CSV file
        run: |
          echo "time" > current_time.csv
          date -u +"%Y-%m-%d %H:%M:%S UTC" >> current_time.csv

      # 3. 查看產生的檔案
      - name: Show CSV
        run: |
          cat current_time.csv

      # 4. 把 CSV commit 回 repository
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add current_time.csv

          git diff --cached --quiet || git commit -m "Update current time CSV"

          git push
